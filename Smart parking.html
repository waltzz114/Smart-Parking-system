<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Parking</title>
<style>
:root {
  --bg: #0b1220;
  --card: #121c2e;
  --card2: #18243a;
  --text: #f5f7fb;
  --muted: #9eabc0;
  --green: #31d158;
  --red: #ff453a;
  --blue: #4f8cff;
  --border: rgba(255,255,255,.09);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: radial-gradient(circle at top, #162544 0, var(--bg) 48%);
  color: var(--text);
  min-height: 100vh;
}
header {
  padding: 28px 20px 12px;
  max-width: 1050px;
  margin: auto;
}
.brand { color: #7fa9ff; font-weight: 800; letter-spacing: 1.5px; }
h1 { margin: 8px 0 4px; font-size: clamp(30px, 6vw, 52px); }
.subtitle { color: var(--muted); }
main { max-width: 1050px; margin: auto; padding: 18px 20px 50px; }
.summary {
  display: grid; grid-template-columns: 1.4fr 1fr 1fr;
  gap: 14px; margin-bottom: 18px;
}
.stat {
  background: rgba(18,28,46,.9); border: 1px solid var(--border);
  border-radius: 20px; padding: 20px;
}
.big { font-size: 38px; font-weight: 800; margin-top: 5px; }
.label { color: var(--muted); font-size: 14px; }
.status { display:flex; align-items:center; gap:8px; font-weight:700; }
.dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.dot.green { background:var(--green); box-shadow:0 0 12px var(--green); }
.dot.red { background:var(--red); box-shadow:0 0 12px var(--red); }

.parking {
  background: rgba(18,28,46,.9); border:1px solid var(--border);
  border-radius:24px; padding:20px;
}
.parking-head {
  display:flex; justify-content:space-between; align-items:center;
  gap:12px; margin-bottom:20px;
}
h2 { margin:0; }
.live {
  color:#8eb2ff; background:#17284b; padding:7px 11px;
  border-radius:999px; font-size:12px; font-weight:700;
}
.slots {
  display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
}
.slot {
  min-height:220px; border-radius:20px; padding:18px;
  display:flex; flex-direction:column; justify-content:space-between;
  border:1px solid var(--border); position:relative; overflow:hidden;
}
.slot.free { background:linear-gradient(145deg,#123321,#10251b); }
.slot.occupied { background:linear-gradient(145deg,#351918,#241517); }
.slot-number { font-size:14px; font-weight:800; color:var(--muted); }
.car {
  font-size:55px; text-align:center; filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));
}
.slot.free .car { opacity:.18; }
.state { font-size:18px; font-weight:800; }
.slot.free .state { color:var(--green); }
.slot.occupied .state { color:var(--red); }
footer {
  color:var(--muted); text-align:center; margin-top:18px; font-size:13px;
}
@media (max-width:700px) {
  .summary { grid-template-columns:1fr; }
  .slots { grid-template-columns:repeat(2,1fr); }
  .slot { min-height:190px; }
}
@media (max-width:420px) {
  .slots { grid-template-columns:1fr 1fr; gap:9px; }
  .slot { min-height:160px; padding:12px; }
  .car { font-size:42px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">SMART PARKING • LIVE</div>
  <h1>Find your parking slot.</h1>
  <div class="subtitle">Scan the QR code to check availability before entering.</div>
</header>

<main>
  <section class="summary">
    <div class="stat">
      <div class="label">AVAILABLE SLOTS</div>
      <div class="big" id="available">1 / 4</div>
      <div class="status"><span class="dot green"></span> Parking available</div>
    </div>
    <div class="stat">
      <div class="label">OCCUPIED</div>
      <div class="big" id="occupied">3</div>
    </div>
    <div class="stat">
      <div class="label">SYSTEM</div>
      <div class="big" style="font-size:24px;margin-top:14px">Online</div>
      <div class="status"><span class="dot green"></span> ESP32 connected</div>
    </div>
  </section>

  <section class="parking">
    <div class="parking-head">
      <h2>Parking Area</h2>
      <div class="live">● LIVE STATUS</div>
    </div>
    <div class="slots" id="slots"></div>
  </section>

  <footer>
    State received from ESP32: <strong id="raw">1110</strong> • Last updated: <span id="time">now</span>
  </footer>
</main>

<script>
// DEMO VALUE:
// 1 = occupied, 0 = free
// 1110 = Slot 1 occupied, Slot 2 occupied, Slot 3 occupied, Slot 4 free.
const parkingValue = "1110";

function render(value) {
  const bits = value.padStart(4, "0").slice(0, 4);
  const slots = document.getElementById("slots");
  let occupied = 0;

  slots.innerHTML = "";

  [...bits].forEach((bit, i) => {
    const isOccupied = bit === "1";
    if (isOccupied) occupied++;

    const card = document.createElement("div");
    card.className = "slot " + (isOccupied ? "occupied" : "free");
    card.innerHTML = `
      <div class="slot-number">PARKING SLOT ${i + 1}</div>
      <div class="car">${isOccupied ? "🚗" : "🅿️"}</div>
      <div class="state">${isOccupied ? "OCCUPIED" : "AVAILABLE"}</div>
    `;
    slots.appendChild(card);
  });

  document.getElementById("available").textContent = `${4 - occupied} / 4`;
  document.getElementById("occupied").textContent = occupied;
  document.getElementById("raw").textContent = bits;
  document.getElementById("time").textContent =
    new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}

render(parkingValue);
</script>
</body>
</html>
